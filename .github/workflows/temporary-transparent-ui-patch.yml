name: Temporary transparent UI patch

on:
  push:
    branches:
      - feature/transparent-consensus
    paths:
      - .github/workflows/temporary-transparent-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transparent-consensus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact UI patch
        run: node scripts/apply-transparent-ui-patch.mjs
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: wire transparent diagnostic copy"
          git push origin HEAD:feature/transparent-consensus
