name: Temporary Fast Core Docs
on:
  push:
    branches: [feature/fast-core-ru-geoip]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fast-core-ru-geoip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update README and spec
        run: node scripts/tmp-update-fast-core-docs.mjs
      - name: Commit docs and remove temporary files
        run: |
          rm .github/workflows/tmp-fast-core-docs.yml scripts/tmp-update-fast-core-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/superpowers/specs/2026-08-11-fast-core-ru-geoip-design.md .github/workflows/tmp-fast-core-docs.yml scripts/tmp-update-fast-core-docs.mjs
          git commit -m "docs: describe fast Core and RU GeoIP activation"
          git push origin HEAD:feature/fast-core-ru-geoip
