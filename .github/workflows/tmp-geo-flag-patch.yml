name: Temporary Geo Flag Patch
on:
  push:
    branches: [feature/fast-core-ru-geoip]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fast-core-ru-geoip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch location and flag rendering
        run: node scripts/tmp-patch-geo-flag.mjs
      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/tmp-geo-flag-patch.yml scripts/tmp-patch-geo-flag.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/dashboard.css .github/workflows/tmp-geo-flag-patch.yml scripts/tmp-patch-geo-flag.mjs
          git commit -m "fix: render GeoIP location with flag fallback"
          git push origin HEAD:feature/fast-core-ru-geoip
