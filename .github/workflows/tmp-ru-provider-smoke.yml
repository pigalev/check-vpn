name: Temporary RU Provider Smoke
on:
  push:
    branches: [feature/fast-core-ru-geoip]
permissions:
  contents: write
jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fast-core-ru-geoip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run RU provider smoke
        run: node scripts/check-ru-provider-cors.mjs --origin=https://pigalev.github.io
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/tmp-ru-provider-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-ru-provider-smoke.yml
          git commit -m "chore: remove temporary RU provider smoke"
          git push origin HEAD:feature/fast-core-ru-geoip
