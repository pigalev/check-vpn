<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minimal browser-based VPN address leak check.">
  <title>VPN Leak Check</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">Network diagnostics</p>
        <h1>VPN Leak Check</h1>
        <p class="intro">Compare public IP, location, and WebRTC addresses exposed by this connection.</p>
      </div>
      <button id="run-tests" class="primary-button" type="button">Run again</button>
    </header>
    <main>
      <section class="summary" aria-live="polite">
        <span id="overall-status" class="status-pill" data-status="idle">Starting</span>
        <p id="overall-message">The available checks start automatically.</p>
      </section>
      <section id="results-grid" class="results-grid" aria-label="Test results"></section>
      <div class="report-actions">
        <button id="copy-json" class="secondary-button" type="button" disabled>Copy JSON</button>
      </div>
    </main>
  </div>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
